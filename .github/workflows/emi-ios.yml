# Builds an unsigned EMI Acess iOS ipa. See EMI-CUSTOM.md.
#
# Without an Apple Developer account the ipa cannot be installed on an iPhone. It proves
# the app builds and can be signed later.
#
# The build job is a trimmed copy of `build-rustdesk-ios` in flutter-build.yml. Keep the
# versions in `env` and the steps in sync with that job when merging from upstream.
name: EMI Acess iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"

jobs:
  check-secrets:
    runs-on: ubuntu-22.04
    steps:
      - name: Check branch and build secrets
        shell: bash
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          EMI_SETTINGS_HASH: ${{ secrets.EMI_SETTINGS_HASH }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/emi-custom" ]]; then
            echo "::error::Run this workflow on the emi-custom branch."
            exit 1
          fi
          # Without these the client would silently use the public RustDesk server.
          if [[ -z "$RENDEZVOUS_SERVER" || -z "$RS_PUB_KEY" ]]; then
            echo "::error::Set the RENDEZVOUS_SERVER and RS_PUB_KEY secrets."
            exit 1
          fi
          if [[ ! "$EMI_SETTINGS_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::EMI_SETTINGS_HASH is missing or not lowercase SHA-256 hex. The server settings will stay locked in this build."
          fi

  generate-bridge:
    needs: [check-secrets]
    uses: ./.github/workflows/bridge.yml

  build-ios:
    name: iOS aarch64 (unsigned)
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: aarch64,
              target: aarch64-apple-ios,
              os: macos-latest,
              vcpkg-triplet: arm64-ios,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          brew install nasm yasm
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios
          key: ${{ matrix.job.target }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Build rustdesk lib
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          EMI_SETTINGS_HASH: ${{ secrets.EMI_SETTINGS_HASH }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib

      - name: Build rustdesk
        shell: bash
        run: |
          pushd flutter
          flutter build ipa --release --no-codesign
          popd
          # --no-codesign stops at the archive, so package the app as an ipa by hand.
          mkdir -p ipa/Payload
          cp -R flutter/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app ipa/Payload/
          (cd ipa && zip -qry "../EMI-Acess-${{ env.VERSION }}-ios-unsigned.ipa" Payload)

      - name: Upload ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EMI-Acess-${{ env.VERSION }}-ios-unsigned
          path: EMI-Acess-${{ env.VERSION }}-ios-unsigned.ipa
          if-no-files-found: error
